name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Check and package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Vite+, Node.js, pnpm, and dependencies
        uses: voidzero-dev/setup-vp@v1.19.0
        with:
          node-version: "24"
          cache: true
          run-install: |
            args: ["--frozen-lockfile"]

      - name: Check formatting, lint, and types
        run: vp check

      - name: Run tests
        run: vp run test

      - name: Build package
        run: vp pack

      - name: Lint package
        run: vp run check:package

      - name: Create package tarball
        run: vp pm pack --pack-destination package-artifacts

      - name: Upload package tarball
        uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: package-artifacts/*.tgz
          if-no-files-found: error
