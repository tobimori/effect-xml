name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create release pull request or publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Vite+, Node.js, pnpm, and dependencies
        uses: voidzero-dev/setup-vp@v1.19.0
        with:
          node-version: "24"
          cache: true
          run-install: |
            args: ["--frozen-lockfile"]

      - name: Check formatting, lint, and types
        run: vp check

      - name: Build package
        run: vp pack

      - name: Lint package
        run: vp run check:package

      - name: Upgrade npm for OIDC support
        run: npm install --global npm@11

      - name: Create release pull request or publish
        uses: changesets/action@v2
        with:
          publish-script: vp run release
          commit-message: "release: update package version"
          pr-title: "release: update package version"
          create-github-releases: true
